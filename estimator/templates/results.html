<div class="results-container" style="font-family: sans-serif; max-width: 600px; margin: auto; border: 1px solid #ddd; padding: 20px; border-radius: 8px;">
    <h1 style="color: #2c3e50;">Estimation Results</h1>
    <h2 style="color: #34495e;">Project: {{ project.name }}</h2>
    <p><strong>Notes:</strong> {{ notes }}</p>
    <hr>

    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
        <span><strong>Total Surface Area:</strong></span>
        <span>{{ sqft }} Sq. Ft.</span>
    </div>

    <div style="display: flex; justify-content: space-between; margin-bottom: 10px; background: #f9f9f9; padding: 10px;">
        <span><strong>Roofing Squares:</strong></span>
        <span style="font-size: 1.2em; color: #27ae60;"><strong>{{ squares }} SQ</strong></span>
    </div>

    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
        <span><strong>Pitch Multiplier ({{ pitch }}/12):</strong></span>
        <span>x{{ multiplier }}</span>
    </div>

    <hr>

    <h3 style="color: #2c3e50;">Estimated Material Cost</h3>
    <p style="font-size: 0.9em; color: #666;">(Placeholder for ABC Supply Live Pricing)</p>
    <div style="font-size: 1.5em; font-weight: bold; color: #e67e22;">
        $ --. --
    </div>

    <div style="margin-top: 30px;">
        <button onclick="window.print()" style="padding: 10px 20px; background: #34495e; color: white; border: none; cursor: pointer;">Print Summary</button>
        <a href="/" style="margin-left: 10px; color: #3498db; text-decoration: none;">New Estimate</a>
    </div>
</div>
