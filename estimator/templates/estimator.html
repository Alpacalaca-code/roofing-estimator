<form method="POST">
    {% csrf_token %}
    <h2>Project Estimator</h2>
    <input type="text" name="project_name" placeholder="Job Name">
    <input type="number" step="0.1" name="pitch" placeholder="Pitch (e.g., 6)">

    <div id="rows">
        <div class="row">
            <input type="number" step="0.1" name="length[]" placeholder="L"> x 
            <input type="number" step="0.1" name="width[]" placeholder="W">
        </div>
    </div>
    
    <button type="button" onclick="addMore()">+ Add More</button>
    <button type="submit">Calculate Everything</button>

    <div class="row">
    <div class="col">
        <label>Waste Factor (%)</label>
        <input type="number" name="waste" value="10">
    </div>
    <div class="col">
        <label>Estimated Dump Cost ($)</label>
        <input type="number" name="dump" value="500">
    </div>
</div>
</form>

<script>
function addMore() {
    const div = document.createElement('div');
    div.innerHTML = '<input type="number" step="0.1" name="length[]" placeholder="L"> x <input type="number" step="0.1" name="width[]" placeholder="W">';
    document.getElementById('rows').appendChild(div);
}
</script>
